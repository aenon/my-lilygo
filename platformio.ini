; My LilyGo — PlatformIO workspace for personal LilyGo firmware.
;
; Layout:
;   apps/<device>/<app>/main/   -- one app per dir, per device
;   apps/_shared/               -- cross-device libraries (TBD)
;   vendor/<vendor-repo>/       -- gitignored upstream LilyGo repos (run
;                                  scripts/bootstrap-vendor.sh to populate)
;
; Currently supported devices:
;   - t5_epaper_s3_pro  (LilyGo T5 E-Paper S3 Pro, H752-02)
;   - t_dongle_s3       (LilyGo T-Dongle S3, K193) -- placeholder, no apps yet
;
; Each [env:*] block selects (a) which device to target and (b) which app
; under that device to compile, via build_src_filter.
;
; Build a specific env:
;     pio run -e t5_epaper_s3_pro -t upload
;     pio run -e t_dongle_s3      -t upload   (once enabled)

[platformio]
default_envs = t5_epaper_s3_pro
src_dir      = apps
boards_dir   = boards

; ----- Shared base for ESP32-S3 boards --------------------------------------
[base_esp32s3]
platform        = espressif32@6.5.0
framework       = arduino
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I apps/_shared
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wl,--gc-sections

lib_deps =
    Wire
    SPI
    bblanchon/ArduinoJson@^7.0.4

; ============================================================================
; T5 E-Paper S3 Pro (H752-02) -- 4.7" 960x540 16-gray, LoRa+GPS option
; ============================================================================
[env:t5_epaper_s3_pro]
extends         = base_esp32s3
board           = T5-ePaper-S3
build_flags     = ${base_esp32s3.build_flags} -DPSRAM_SPEED=120MHz
lib_extra_dirs  = vendor/T5S3-4.7-e-paper-PRO/lib

; --- pick exactly one app to build ---
; build_src_filter = +<t5_epaper_s3_pro/weather_dashboard/main/>
; build_src_filter = +<t5_epaper_s3_pro/sanity_check/main/>
; build_src_filter = +<t5_epaper_s3_pro/gps_dashboard/main/>
; build_src_filter = +<t5_epaper_s3_pro/portrait_dashboard/main/>
build_src_filter = +<t5_epaper_s3_pro/http_display/main/>

; ============================================================================
; T-Dongle S3 (K193) -- ESP32-S3 USB stick with 0.96" LCD
; ============================================================================
; T-Dongle S3 has NO PSRAM: strip BOARD_HAS_PSRAM from the shared base.
; USB CDC on boot stays enabled (native USB-Serial/JTAG is the data path).

[env:t_dongle_s3_pc_monitor]
extends          = base_esp32s3
board            = dongles3
lib_extra_dirs   = vendor/T-Dongle-S3/lib
build_flags      = ${base_esp32s3.build_flags} -UBOARD_HAS_PSRAM
build_src_filter = +<t_dongle_s3/pc_monitor/main/>
